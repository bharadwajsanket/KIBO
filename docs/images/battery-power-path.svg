<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Kibo battery charging subsystem and unfinished power path</title>
  <desc id="desc">A USB-C TP4056 charger module connects to a 602030 LiPo battery at B+ and B-. Its protected output is not connected to the ESP32; a regulated power path still needs to be designed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f0ece5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4b3525" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b574f"/></marker>
  </defs>
  <rect width="1440" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#25211d">Battery subsystem · power path still pending</text>
  <text x="64" y="108" font-family="Inter,Arial,sans-serif" font-size="19" fill="#766b60">Your Type-C TP4056 protection module and 602030 3.7 V LiPo</text>
  <g fill="none" stroke="#5b574f" stroke-width="5" marker-end="url(#arrow)">
    <path d="M320 292 H475"/>
    <path d="M880 252 H1035"/>
    <path d="M880 335 H1035"/>
    <path d="M880 380 H920 V420 H1342 V383" stroke="#c33d32" stroke-dasharray="10 10" marker-end="none"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="210" width="250" height="165" rx="20" fill="#e7e2d9" stroke="#d0c8bd" stroke-width="2"/>
    <text x="195" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#25211d">USB-C 5 V</text>
    <text x="195" y="297" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#625b52">charger input</text>
    <rect x="166" y="322" width="58" height="25" rx="12" fill="#3a3936"/>

    <rect x="475" y="180" width="405" height="225" rx="22" fill="#23604a"/>
    <text x="677" y="230" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#fffaf1">TP4056 · Type-C</text>
    <text x="677" y="264" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#cfe0d5">with protection · module pins</text>
    <text x="525" y="315" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#fffaf1">B+ / B−</text>
    <text x="720" y="315" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#fffaf1">OUT+ / OUT−</text>
    <text x="525" y="354" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cfe0d5">battery pads</text>
    <text x="720" y="354" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cfe0d5">protected load pads</text>

    <rect x="1035" y="205" width="260" height="180" rx="20" fill="#e6b85f" stroke="#c89539" stroke-width="2"/>
    <rect x="1065" y="240" width="200" height="105" rx="12" fill="#d9a542"/>
    <text x="1165" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#342817">602030 LiPo</text>
    <text x="1165" y="310" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#4f3f23">3.7 V · 500 mAh</text>

    <rect x="1290" y="208" width="105" height="175" rx="18" fill="#fff0cf" stroke="#d69339" stroke-width="2"/>
    <path d="M1325 255 H1360 M1342 238 V272" stroke="#ad752b" stroke-width="6" stroke-linecap="round"/>
    <text x="1342" y="310" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#624719">REGULATOR</text>
    <text x="1342" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#624719">+ POWER</text>
    <text x="1342" y="354" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#624719">PATH</text>
  </g>
  <text x="420" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#655c51">5 V input</text>
  <text x="1030" y="408" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#a52f2b">OUT+ / OUT− · unregulated · design pending</text>
  <path d="M1005 408 l15 15 m0 -15 l-15 15" stroke="#c33d32" stroke-width="4" stroke-linecap="round"/>
  <text x="957" y="230" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#655c51">B+ ↔ battery +</text>
  <text x="957" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#655c51">B− ↔ battery −</text>
  <rect x="70" y="450" width="1325" height="108" rx="18" fill="#fff0cf" stroke="#e2c27e" stroke-width="2"/>
  <text x="100" y="490" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#5c451b">Do not connect OUT+ or OUT− directly to the ESP32-C3 5V/VBUS or 3V3 pin.</text>
  <text x="100" y="526" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6e562b">The TP4056 output follows battery voltage. A regulated supply and a safe charge/load-sharing design must be added and tested first.</text>
</svg>
